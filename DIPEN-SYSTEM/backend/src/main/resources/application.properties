# ============================================================================
# DIPEN SYSTEM – MANUFACTURING ERP (Spring Boot Configuration)
# Optimized for Windows 11 Office Server (8 GB RAM, 2-5 concurrent users)
# ============================================================================

spring.application.name=DIPEN-SYSTEM-ERP
server.port=${SERVER_PORT:${DIPEN_SERVER_PORT:8080}}
server.address=${DIPEN_SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json

# Primary Authoritative Database (MySQL 8.4 Community)
spring.datasource.url=${DIPEN_DB_URL:jdbc:mysql://localhost:3306/DIPEN_ERP?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kathmandu&characterEncoding=UTF-8}
spring.datasource.username=${DIPEN_DB_USER:dipen_app}
spring.datasource.password=${DIPEN_DB_PASSWORD:change_me_in_prod}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (tuned for 2-5 concurrent users)
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.pool-name=DipenErpPool

# JPA & Flyway (never auto-DDL in production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Timezone & Jackson Serialization
spring.jackson.time-zone=Asia/Kathmandu
spring.jackson.serialization.write-dates-as-timestamps=false

# ERP Domain Configuration
dipen.company.name=Birat Healthcare Industries Pvt. Ltd.
dipen.timezone=Asia/Kathmandu
dipen.session.ttl-seconds=21600

# Connected Google Spreadsheets (Preserved exact IDs)
dipen.google.operations-spreadsheet-id=${DIPEN_OPS_SHEET_ID:1gGmpt4gKEE4Nu42960A8cmdrXaTpT-IKHW5oTAWGAJs}
dipen.google.procurement-spreadsheet-id=${DIPEN_PROC_SHEET_ID:16SN_MJjvmWqt_OH8Hol3AVGB6hWFTM_rYOG1FTi2-yY}
dipen.google.credentials-path=${DIPEN_GOOGLE_CREDENTIALS_PATH:}
dipen.google.application-name=DIPEN-SYSTEM-ERP
dipen.google.auto-sync-enabled=${DIPEN_GOOGLE_AUTO_SYNC:true}
dipen.google.auto-sync-interval-ms=${DIPEN_GOOGLE_AUTO_SYNC_INTERVAL_MS:30000}

# Automated MySQL Backup Configuration (Daily 02:00 AM Asia/Kathmandu)
dipen.backup.enabled=${DIPEN_BACKUP_ENABLED:true}
dipen.backup.directory=${DIPEN_BACKUP_DIR:D:/DIPEN_BACKUPS}
dipen.backup.mysqldump-path=${DIPEN_MYSQLDUMP_PATH:mysqldump}
dipen.backup.mysql-path=${DIPEN_MYSQL_PATH:mysql}
dipen.backup.retention-days=${DIPEN_BACKUP_RETENTION_DAYS:30}
dipen.backup.cron=0 0 2 * * *
